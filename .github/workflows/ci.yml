name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q

  retrieval-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-retrieval.lock
      - run: python -m pip install -r requirements-retrieval.lock
      - name: Validate optional embedding package without model download
        run: python -c "from fastembed import TextEmbedding; assert any(m['model'] == 'BAAI/bge-small-zh-v1.5' for m in TextEmbedding.list_supported_models())"
      - run: python -m pytest -q
